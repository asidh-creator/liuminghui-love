<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160d21">
  <meta name="robots" content="noindex, nofollow">
  <title>致刘明慧 · 私密情书</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="authTitle">
      <div class="auth-mark" aria-hidden="true">L · M · H</div>
      <p class="auth-eyebrow">A PRIVATE LETTER</p>
      <h1 id="authTitle">这封信，只写给特别的人。</h1>
      <p class="auth-copy">请输入访问密码，继续阅读写给刘明慧的情书。</p>
      <form id="unlockForm" class="auth-form">
        <label for="accessPassword">访问密码</label>
        <div class="password-row">
          <input id="accessPassword" name="accessPassword" type="password" minlength="8" autocomplete="current-password" required autofocus>
          <button class="show-password" id="togglePassword" type="button" aria-label="显示密码">显示</button>
        </div>
        <button class="primary-button" id="unlockButton" type="submit">打开这封情书 <span aria-hidden="true">♥</span></button>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footnote">密码只用于验证，不会保存在浏览器中。</p>
    </section>
  </main>
  <script src="auth-config.js"></script>
  <script src="lock-app.js"></script>
</body>
</html>
